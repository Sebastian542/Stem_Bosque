allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir("../../build").get())

subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name).get())
}

// Parche agresivo para plugins antiguos (Namespace)
subprojects {
    project.afterEvaluate {
        if (project.hasProperty("android")) {
            android {
                if (namespace == null) {
                    namespace = "co.edu.unbosque.stem_bosque" // Fallback seguro
                }
            }
        }
    }
}

// Forzar el namespace específico para el plugin conflictivo
subprojects {
    if (project.name == "flutter_bluetooth_serial") {
        project.android.namespace = "io.github.edufolly.flutter_bluetooth_serial"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
