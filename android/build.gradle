allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir("../../build").get())

subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name).get())
    project.evaluationDependsOn(":app")
}

// Inyección de Namespace segura sin afterEvaluate
gradle.projectsLoaded {
    rootProject.subprojects { prj ->
        prj.beforeEvaluate {
            if (prj.hasProperty("android")) {
                if (prj.android.namespace == null) {
                    def manifestFile = prj.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifest = new XmlParser().parse(manifestFile)
                        def packageName = manifest."@package"
                        if (packageName != null) {
                            prj.android.namespace = packageName
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
