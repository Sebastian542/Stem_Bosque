allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // Parche de Namespace y Versiones para plugins antiguos
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            // Forzar versiones de compilación para evitar errores como lStar
            project.android {
                compileSdkVersion 35 // Suficiente para lStar (API 31+)
                buildToolsVersion "35.0.0"
                
                // Asegurar namespace si falta
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestXml = new XmlParser().parse(manifestFile)
                        def packageName = manifestXml.@package
                        if (packageName) {
                            namespace = packageName
                        } else {
                            namespace = "co.edu.unbosque.stem_bosque.plugin.${project.name.replaceAll(/[^a-zA-Z0-9]/, "")}"
                        }
                    }
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
