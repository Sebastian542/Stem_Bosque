pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"

// Inyección temprana de Namespace para plugins antiguos
gradle.getGradle().projectsLoaded { g ->
    g.rootProject.childProjects.each { name, prj ->
        if (prj.hasProperty("android") || name == "flutter_bluetooth_serial") {
            prj.afterEvaluate {
                if (prj.hasProperty("android")) {
                    if (prj.android.namespace == null) {
                        prj.android.namespace = "co.edu.unbosque.stem_bosque.plugin." + name.replaceAll("[^a-zA-Z0-9]", "")
                    }
                }
            }
        }
    }
}
