name: stem_bosque
description: "IDE de desarrollo para lenguaje DSL de robótica educativa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.2
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^2.3.11
  # 13.x trae permission_handler_android 14.x, cuyo build.gradle.kts no
  # compila con AGP 8.11 / Kotlin 2.3 (bloque kotlin { compilerOptions }).
  permission_handler: 12.0.3
  share_plus: ^13.3.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# permission_handler_html 0.1.4+0 usa `isA()` sobre `Object`, disponible solo
# en Dart 3.12+. Con Dart 3.11 fijamos la versión previa (compatible y
# funcionalmente equivalente) para evitar el error de compilacion en web.
dependency_overrides:
  permission_handler_html: 0.1.3+5

flutter:
  uses-material-design: true
  assets:
    - assets/images/tita_neutral.webp
    - assets/images/tita_happy.webp
    - assets/images/tita_confused.webp
    - assets/images/tita_excited.webp
    - assets/images/tita_watching.webp

  # Fuentes incluidas en la app: no se descargan al abrirla y el código se ve
  # igual (monoespaciado) en Android, iOS, web y escritorio.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
