name: stem_bosque
description: "IDE de desarrollo para lenguaje DSL de robótica educativa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0
  file_picker: 8.3.7
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: 1.32.12
  permission_handler: ^11.3.1
  android_intent_plus: 4.0.3
  share_plus: ^7.2.2
  local_auth: ^3.0.1
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/tita_neutral.png
    - assets/images/tita_happy.png
    - assets/images/tita_confused.png
    - assets/images/tita_excited.png
    - assets/images/tita_watching.png
