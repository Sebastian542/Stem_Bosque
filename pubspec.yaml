name: stem_bosque
description: "IDE de desarrollo para lenguaje DSL de robótica educativa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Dependencias de UI
  cupertino_icons: ^1.0.6
  
  # Manejo de archivos y descargas
  file_picker: ^11.0.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.5
  
  # Bluetooth - Soporte para BLE y Clásico
  flutter_bluetooth_serial: ^0.4.0  # Para Bluetooth Clásico

  # Bluetooth BLE
  flutter_blue_plus: 2.2.1
  permission_handler: ^11.3.1

  android_intent_plus: ^6.0.0

  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true 