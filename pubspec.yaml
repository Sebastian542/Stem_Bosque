name: stem_bosque
description: "IDE de desarrollo para lenguaje DSL de robótica educativa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_bluetooth_serial: ^0.4.0
  flutter_blue_plus: ^2.3.11
  permission_handler: ^12.0.3
  android_intent_plus: ^6.1.0
  share_plus: ^13.3.0
  local_auth: ^3.0.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# permission_handler_html 0.1.4+0 usa `isA()` sobre `Object`, disponible solo
# en Dart 3.12+. Con Dart 3.11 fijamos la versión previa (compatible y
# funcionalmente equivalente) para evitar el error de compilacion en web.
dependency_overrides:
  permission_handler_html: 0.1.3+5

flutter:
  uses-material-design: true
  assets:
    - assets/images/tita_neutral.png
    - assets/images/tita_happy.png
    - assets/images/tita_confused.png
    - assets/images/tita_excited.png
    - assets/images/tita_watching.png
