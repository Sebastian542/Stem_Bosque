name: CI/CD Flutter Web

on:
  push:
    branches:
      - aleja

# Permisos necesarios para desplegar a GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Evita que múltiples despliegues choquen entre sí
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Sincronizar aleja con main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge -X theirs aleja
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: 4. Instalar dependencias
        run: flutter pub get

      - name: 5. Construir Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: 6. Subir Artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: 7. Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
