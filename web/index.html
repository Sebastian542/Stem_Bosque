<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IDE de programación educativa para robótica - StemBosque">

  <!-- Favicon y PWA -->
  <link rel="icon" type="image/png" href="favicon.png?v=4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=4">
  <link rel="manifest" href="manifest.json?v=4">

  <!-- Configuración de Pantalla -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StemBosque">
  <meta name="theme-color" content="#21222c">

  <!-- CSP: Optimizada para Flutter Web y Firebase -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://www.google.com; connect-src 'self' blob: https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com wss://*.firebaseio.com https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://stembosque.firebaseapp.com https://stembosque.web.app; worker-src 'self' blob:; object-src 'none';">

  <title>StemBosque IDE</title>

  <style>
    body {
      background-color: #282a36;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #f8f8f2;
      font-family: sans-serif;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #bd93f9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div id="loading-text">Iniciando StemBosque...</div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
